# keyd config: Caps Lock is the Hyper key.
#   hold -> Ctrl+Alt+Shift+Super (hyperMod in ~/dotfiles/hypr/keybindings/vars.lua)
#   tap  -> Escape
#
# Installed as a copy at /etc/keyd/default.conf (keyd runs as root, so it is
# deliberately not a symlink into the home directory). After editing:
#   sudo install -m 644 ~/dotfiles/keyd/default.conf /etc/keyd/default.conf && sudo keyd reload

[ids]
*

[main]
capslock = overload(hyper, esc)

[hyper:C-A-S-M]
