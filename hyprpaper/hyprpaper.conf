# hyprpaper config. See https://wiki.hypr.land/hypr-ecosystem/hyprpaper/
# Symlinked to ~/.config/hypr/hyprpaper.conf.
# Wallpaper images live in ~/dotfiles/wallpapers.

splash = false

# Leave monitor empty to apply to every monitor.
wallpaper {
    monitor  =
    path     = ~/dotfiles/wallpapers/gantavya-bhatt-mmcSaJrRuCM-unsplash.jpg
    fit_mode = cover
}
